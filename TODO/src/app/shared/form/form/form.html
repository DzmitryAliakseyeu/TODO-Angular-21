

<form [formGroup]="tasksForm">
  <div class="input-row">
    <input
      type="text"
      formControlName="task"
      placeholder="Add a task"
      aria-label="Task name"
    />
    <button type="button" (click)="addTask()">Add</button>
  </div>

  <ul>
    @for(task of tasks(); track task.id){
        @if(!task.completed){
        <li>
            <span>{{ task.text }}</span>
            <div class="buttons-container">
                <button type="button" aria-label="Button to complete task item" (click)="completeTask(task.id)">Complete</button>
                <button type="button" aria-label="Button to remove task item" (click)="removeTask(task.id)">Remove</button>
            </div>
        </li>
        } @else {
            <li>    
                <span>{{ task.text }}</span>
                <button type="button" aria-label="Button to remove task item" (click)="removeTask(task.id)">Remove</button>
            </li>
            
        }
    }
  </ul>
</form>
