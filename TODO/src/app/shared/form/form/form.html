

<form [formGroup]="tasksForm">
  <div class="input-row">
    <input
      type="text"
      formControlName="task"
      placeholder="Add a task"
      aria-label="Task name"
    />
    <button type="button" (click)="addTask()">Add</button>
  </div>

  <ul>
    @for(task of tasks(); let i = $index; track i){
      <li id="{{i}}">
        <span>{{ task }}</span>
        <button type="button">Remove</button>
      </li>
    }
     
  </ul>
</form>
