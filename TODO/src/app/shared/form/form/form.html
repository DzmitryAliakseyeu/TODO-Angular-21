

<form [formGroup]="tasksForm">
  <div class="input-row">
    <input
      type="text"
      formControlName="task"
      placeholder="Add a task"
      aria-label="Task name"
    />
    <button type="button" (click)="addTask()" aria-label="Add task">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <ul>
    @for(task of tasks(); track task.id){
        @if(!task.completed){
        <li>
            <span>{{ task.text | firstCapitalLetter }}</span>
            <div class="buttons-container">
                <button type="button" aria-label="Button to complete task item" (click)="completeTask(task.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>
                <button type="button" aria-label="Button to remove task item" (click)="removeTask(task.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
            </div>
        </li>
        } @else {
            <li class="is-completed">    
                <span>{{ task.text | firstCapitalLetter }}</span>
                <button type="button" aria-label="Button to remove task item" (click)="removeTask(task.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
            </li>
            
        }
    }
  </ul>
</form>
